<script>
const wheel=document.querySelector('#wheel'), statusLine=document.querySelector('#status');
const fruits=[['🍐','poire'],['🍓','fraise'],['🍒','cerise'],['🍋','citron']];
let board=[], selected=-1;
function render(){
 wheel.querySelectorAll('button').forEach(button=>button.remove());
 board.forEach((fruit,i)=>{
  const angle=2*Math.PI*i/board.length-Math.PI/2;
  const button=document.createElement('button');
  button.style.left=(50+37*Math.cos(angle))+'%';
  button.style.top=(50+37*Math.sin(angle))+'%';
  button.textContent=fruits[fruit][0];button.setAttribute('aria-label',fruits[fruit][1]+', position '+(i+1));
  button.setAttribute('aria-pressed',String(selected===i));button.onclick=()=>pick(i);wheel.append(button);
 });
}
function pick(i){
 if(selected===i){selected=-1;statusLine.textContent='Sélection annulée.'}
 else if(selected<0){selected=i;statusLine.textContent='Choisis le fruit voisin identique.'}
 else{
  const gap=Math.abs(selected-i);
  if((gap===1||gap===board.length-1)&&board[selected]===board[i]){
   board=board.filter((_,j)=>j!==selected&&j!==i);
   statusLine.textContent=board.length?'Paire récoltée. Fruits restants : '+board.length:'Bravo ! Tu as vidé la roue.';
  }else{statusLine.textContent='Choisis deux fruits voisins identiques.'}
  selected=-1;
 }
 render();(wheel.querySelectorAll('button')[Math.min(i,board.length-1)]||document.querySelector('#again')).focus();
}
function start(){board=[];for(let fruit=0;fruit<4;fruit++){const pos=Math.floor(Math.random()*(board.length+1));board.splice(pos,0,fruit,fruit)}selected=-1;render();statusLine.textContent='Huit fruits à récolter.'}
document.querySelector('#again').onclick=start;start();
</script></html>
